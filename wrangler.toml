name = "otklikator"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Публичный адрес сайта: ссылки в письмах и redirect после Stripe Checkout.
APP_URL = "http://localhost:8787"
# Price из Stripe Dashboard: recurring, интервал week (сейчас $5 / неделю).
STRIPE_PRICE_ID = "price_REPLACE_ME"
# Отправитель писем (домен должен быть подтверждён в Resend).
EMAIL_FROM = "Otklikator <noreply@example.com>"

[[d1_databases]]
binding = "DB"
database_name = "otklikator"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

# Секреты (не в этом файле!):
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put RESEND_API_KEY
# Локально — в .dev.vars (файл в .gitignore), пример в .dev.vars.example
