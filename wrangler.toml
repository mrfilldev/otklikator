name = "otklikator"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Публичный адрес сайта: ссылки в письмах и redirect после Stripe Checkout.
APP_URL = "https://otklikator.mrfilldev.workers.dev"
# Price из Stripe Dashboard (test mode): recurring, €5 в неделю.
STRIPE_PRICE_ID = "price_1Ug9rRRotwuJoz0Ia1savgC3"
# Отправитель писем (onboarding@resend.dev работает без домена, но только на адрес владельца аккаунта Resend; для пользователей нужен свой домен).
EMAIL_FROM = "Otklikator <onboarding@resend.dev>"
# Модель на OpenRouter для автозаполнения анкеты по CV.
OPENROUTER_MODEL = "z-ai/glm-5.3"

[[d1_databases]]
binding = "DB"
database_name = "otklikator"
database_id = "6066b966-187e-4937-8a02-d23ec0ab8f0e"
migrations_dir = "migrations"

# Сбор вакансий и подбор по анкетам (src/lib/jobs). Каждый запуск опрашивает только источники, у которых подошёл срок
# (свой у каждого, ~4–5 раз в сутки). Наследуется в [env.production].
[triggers]
crons = ["*/20 * * * *"]

# Загруженные CV (оригиналы файлов). Создать один раз: npx wrangler r2 bucket create otklikator-cv
[[r2_buckets]]
binding = "CV_BUCKET"
bucket_name = "otklikator-cv"

# Секреты (не в этом файле!):
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put OPENROUTER_API_KEY   (автозаполнение анкеты по CV)
# Локально — в .dev.vars (файл в .gitignore), пример в .dev.vars.example

# ---------------------------------------------------------------------------
# Прод: отдельный воркер, своя база, live-ключи Stripe.
#   npx wrangler d1 create otklikator-prod        → database_id ниже
#   npm run deploy:prod
#   npx wrangler secret put STRIPE_SECRET_KEY --env production   (и остальные секреты)
# Блок выше (без --env) — тестовая среда на test-ключах Stripe.
[env.production]
name = "otklikator-prod"
routes = [{ pattern = "otklikator.app", custom_domain = true }]

[env.production.vars]
APP_URL = "https://otklikator.app"
STRIPE_PRICE_ID = "price_1Ug9ktRotwuJoz0InOAXgnih"
OPENROUTER_MODEL = "z-ai/glm-5.3"
EMAIL_FROM = "Otklikator <noreply@otklikator.app>"  # домен подтверждается в Resend (DNS)

[[env.production.d1_databases]]
binding = "DB"
database_name = "otklikator-prod"
database_id = "01982939-adbc-487a-85f8-1ee217cfcdf5"
migrations_dir = "migrations"

# npx wrangler r2 bucket create otklikator-cv-prod
[[env.production.r2_buckets]]
binding = "CV_BUCKET"
bucket_name = "otklikator-cv-prod"
